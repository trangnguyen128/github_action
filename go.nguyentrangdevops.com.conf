server {
    listen 80;
    listen [::]:80;

    server_name go.nguyentrangdevops.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name go.nguyentrangdevops.com;

    ssl_certificate /etc/nginx/ssl/nguyentrangdevops.com.cer;
    ssl_certificate_key /etc/nginx/ssl/nguyentrangdevops.com.key;

    location / {
        limit_req zone=api_limit burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://0.0.0.0:8002;
        include proxy_params;
    }
}

# rate 1r/s
# không có burst
# 0ms
# - request 1
# - request 2 - từ chối
# 1000ms

# có burst=3
# 0ms
# - request 1
# - request 2 - cho phép
# - request 3 - cho phép
# - request 4 - cho phép
# 1000ms